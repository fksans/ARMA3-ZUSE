name: Build

# - 推到 main / 提 PR：只运行 hemtt check（检查配置、SQF、stringtable）
# - 推 v* 标签（例如 v1.0.1）：hemtt release 构建 + 签名，并发布到 GitHub Releases
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: arma-actions/hemtt@v1
      - name: hemtt check
        run: hemtt check

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: arma-actions/hemtt@v1

      # 标签必须和 addons/main/script_version.hpp 里的版本一致，避免发出版本号对不上的包
      - name: Check tag matches script_version.hpp
        run: |
          version="$(hemtt value project.version.short)"
          tag="${GITHUB_REF_NAME#v}"
          echo "script_version.hpp: ${version}  tag: ${tag}"
          if [ "${version}" != "${tag}" ]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 和 script_version.hpp 的版本 ${version} 不一致，请先改版本号再打标签"
            exit 1
          fi

      # CI 里没有私钥文件：HEMTT 每次生成新 key，authority 为 zmp_<版本号>
      - name: hemtt release
        run: hemtt release

      - name: Collect release files
        id: files
        run: |
          version="$(hemtt value project.version)"
          zip="releases/zmp-${version}.zip"
          bikey="$(ls .hemttout/release/keys/*.bikey)"
          test -f "${zip}"
          echo "zip=${zip}" >> "$GITHUB_OUTPUT"
          echo "bikey=${bikey}" >> "$GITHUB_OUTPUT"
          echo "bikey_name=$(basename "${bikey}")" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.files.outputs.zip }}
            ${{ steps.files.outputs.bikey }}
          generate_release_notes: true
          body: |
            ## 下载

            - **Zeus 玩家**：下载 `zmp-*.zip`，解压得到 `@zeus_music_player`，在 Arma 3 启动器里「添加本地模组」后勾选（同时加载 CBA_A3 和 ZEN）。其他玩家不用装。
            - **服务器腐竹**：下载 `${{ steps.files.outputs.bikey_name }}`，放进服务器根目录的 `keys/` 文件夹后重启服务器，服务器不需要加载本模组。详见 [docs/SERVER_KEY_INSTALL.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/SERVER_KEY_INSTALL.md)。

            > 每个版本的 key 都不一样，更新版本后腐竹需要换上这个版本的 `.bikey`。
